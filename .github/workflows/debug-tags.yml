name: debug-tags

# 一次性排查用：确认上游镜像到底在哪、tag 叫什么。
# 结论落进 README 的「上游镜像」一节后，这个文件就可以删。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Docker Hub tag 总数与新头几个
        run: |
          set -euo pipefail
          node - <<'JS'
          const repo = 'agentscope/qwenpaw';
          const url = `https://hub.docker.com/v2/repositories/${repo}/tags?page_size=100&ordering=last_updated`;
          const res = await fetch(url, { headers: { accept: 'application/json' } });
          console.log('HTTP', res.status);
          const json = await res.json();
          console.log('count =', json.count, 'results =', (json.results ?? []).length);
          for (const t of (json.results ?? []).slice(0, 8)) {
            console.log(`  ${t.name}\t${t.last_updated}\t${t.digest}`);
          }
          const names = (json.results ?? []).map((t) => t.name);
          for (const want of ['v2.2.2', '2.2.2', 'latest', 'pre', 'v2.2.1', '2.2.1']) {
            console.log(`has ${want}: ${names.includes(want)}`);
          }
          JS

      - name: 直接问 registry：这些 ref 存在吗
        run: |
          set -euo pipefail
          probe() {
            local ref="$1" registry repo tag token code
            registry="${ref%%/*}"; rest="${ref#*/}"; tag="${rest##*:}"; repo="${rest%:*}"
            if [ "$registry" = "docker.io" ]; then
              registry="registry-1.docker.io"
              token=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull" | sed -E 's/.*"token":"([^"]+)".*/\1/')
            else
              token=""
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
              "https://${registry}/v2/${repo}/manifests/${tag}")
            echo "  ${code}  ${ref}"
          }
          echo "== docker.io/agentscope/qwenpaw =="
          for t in v2.2.2 2.2.2 latest pre v2.2.1 v2.0.0.post1; do probe "docker.io/agentscope/qwenpaw:${t}"; done
          echo "== aliyun acr =="
          for t in v2.2.2 latest; do probe "agentscope-registry.ap-southeast-1.cr.aliyuncs.com/agentscope/qwenpaw:${t}"; done
